name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - run: npm pack --ignore-scripts
      - run: sha256sum *.tgz > SHA256SUMS.txt
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" *.tgz SHA256SUMS.txt --verify-tag --title "图像 $RELEASE_TAG" --notes-file CHANGELOG.md
