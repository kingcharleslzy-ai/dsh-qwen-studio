name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=11,<13" "numpy>=1.26,<3" "aiohttp>=3.10,<4"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:privacy
      - run: npm run check:package
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-qwen-studio-package-${{ matrix.os }}
          path: '*.tgz'
